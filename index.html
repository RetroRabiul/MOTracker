<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!--
      Zoom is intentionally left enabled: `user-scalable=no` breaks WCAG 1.4.4.
      `viewport-fit=cover` lets the safe-area insets reach notched/gesture-nav
      devices so headers and the tab bar can clear the system UI.
    -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#2563eb" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0f172a" media="(prefers-color-scheme: dark)" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="MOTracker" />
    <meta
      name="description"
      content="MOTracker is a budget tracker that shows you exactly where your money goes. Log income and expenses, attach receipts, import bank SMS automatically, convert currencies, and export to CSV, Excel or PDF."
    />
    <title>MOTracker — Know exactly where your money goes</title>
  </head>
  <body class="bg-gray-50">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
